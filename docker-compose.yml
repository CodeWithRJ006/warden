services:
  gateway-1:
    build: .
    restart: on-failure:5
    ports:
      - "8081:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgres://user:pass@db:5432/warden?sslmode=disable
      - PRESIDIO_URL=http://presidio-analyzer:3000
      - LOCAL_MODEL_URL=http://local-model
      - EXTERNAL_MODEL_URL=http://external-model
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      presidio-analyzer:
        condition: service_started

  gateway-2:
    build: .
    restart: on-failure:5
    ports:
      - "8082:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgres://user:pass@db:5432/warden?sslmode=disable
      - PRESIDIO_URL=http://presidio-analyzer:3000
      - LOCAL_MODEL_URL=http://local-model
      - EXTERNAL_MODEL_URL=http://external-model
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      presidio-analyzer:
        condition: service_started

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: warden
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d warden"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer
    ports:
      - "5001:3000"

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer
    ports:
      - "5002:3000"

  external-model:
    # stub: returns 200 OK, used to test routing/failover logic only - not a real model
    image: nginx:alpine

